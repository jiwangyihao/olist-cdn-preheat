[package]
name = "olist-cdn-preheat"
version = "0.1.0"
description = "OpenList CDN Preheat Desktop App"
authors = [ "jiwangyihao" ]
license = "MPL-2.0"
repository = "https://github.com/jiwangyihao/olist-cdn-preheat"
edition = "2021"

[lib]
name = "olist_cdn_preheat_lib"
crate-type = [
  "staticlib",
  "cdylib",
  "rlib"
]

[build-dependencies.tauri-build]
version = "2.5"
features = [ ]

[dependencies]
tauri-plugin-shell = "2.3"
tauri-plugin-notification = "2.3"
tauri-plugin-os = "2.3"
tauri-plugin-fs = "2.4"
tauri-plugin-store = "2.4"
serde_json = "1"
reqwest = { version = "0.12.26", features = [
  "json",
  "stream",
  "rustls-tls",
  "gzip",
  "brotli"
] }
tokio = { version = "1.48.0", features = [ "full" ] }
anyhow = "1.0.100"
futures = "0.3.31"
chrono = { version = "0.4.42", features = [ "serde" ] }
uuid = { version = "1.19.0", features = [
  "v4",
  "serde"
] }
url = "2.5.7"
thiserror = "2.0.17"
urlencoding = "2.1.3"

[dependencies.tauri]
version = "2.9"
features = [
  "tray-icon",
  "unstable"
]

[dependencies.serde]
version = "1"
features = [ "derive" ]
